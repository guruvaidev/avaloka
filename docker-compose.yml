version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus's object store for this standalone compose stack. Was
  # minio/minio:RELEASE.2023-03-20T20-16-18Z, which is no longer pullable from
  # Docker Hub (the namespace stopped serving anonymous pulls), so this stack
  # could not come up at all on a machine without that two-year-old layer cached.
  #
  # SeaweedFS serves the same S3 API on 8333. Milvus's MINIO_* settings are its
  # own names for its generic S3 driver, so only the address and port move.
  # Credentials come from the identities file mounted below.
  minio:
    container_name: milvus-seaweedfs
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    ports:
      - "8333:8333"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/data
      # The pair in this file is a fixed development default for the local
      # Compose stack only. Never use it for a deployment: the Helm chart reads
      # its object-store credentials from a Secret, set through chart values.
      - ${DOCKER_VOLUME_DIRECTORY:-.}/deploy/compose/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # MINIO_* are Milvus's own names for its generic S3 driver, not a statement
      # about which store is behind them. Only the port moves (9000 -> 8333).
      MINIO_ADDRESS: minio:8333
      # MinIO defaulted to minioadmin/minioadmin and Milvus's own defaults
      # happened to match, so this stack never had to state them. SeaweedFS takes
      # its identities from a config file, so they are now explicit on both
      # sides -- deploy/compose/seaweedfs-s3.json declares the same pair.
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  attu:
    container_name: attu
    image: zilliz/attu:v2.4.0
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "8001:3000"
    depends_on:
      - "standalone"
