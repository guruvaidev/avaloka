# Real dependencies for tests/containers/ -- started by scripts/integration.sh.
#
# Not deploy/compose/docker-compose.postgres.yml and not the root
# docker-compose.yml, on purpose. Those are a developer's long-lived local
# stack: a fixed container name and host port (two runs collide), a named
# volume (Postgres ignores POSTGRES_PASSWORD once the volume is initialised, so
# a "wrong credentials" check would pass against stale data), a default
# password in the file, and the fixed development key pair in
# deploy/compose/seaweedfs-s3.json. A test fixture needs the opposite of each.
#
# Images are the ones the Helm chart deploys (deploy/helm/avaloka/values.yaml:
# postgres.image and seaweedfs.image), so what is exercised here is what ships.
#
# Every credential is REQUIRED from the environment (`:?`), and the runner
# generates them per run. There is no default to fall back to, so there is
# nothing here to leak and no way to start this stack with a known password.
services:
  postgres:
    image: ${AVALOKA_IT_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${AVALOKA_IT_PG_USER:?generated by scripts/integration.sh}
      POSTGRES_PASSWORD: ${AVALOKA_IT_PG_PASSWORD:?generated by scripts/integration.sh}
      POSTGRES_DB: ${AVALOKA_IT_PG_DB:?generated by scripts/integration.sh}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      # Over TCP: the image's init phase runs a socket-only server first, and a
      # socket check reports ready before the real server is listening.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=64 -volume.max=0
    volumes:
      # Written by the runner into a private temp directory with a generated
      # key pair. Without -s3.config SeaweedFS accepts anonymous requests, and
      # every credential check in the suite would pass for the wrong reason.
      - ${AVALOKA_IT_S3_CONFIG:?generated by scripts/integration.sh}:/etc/seaweedfs/s3.json:ro
    tmpfs:
      - /data
    ports:
      - "127.0.0.1::8333"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/status"]
      interval: 2s
      timeout: 3s
      retries: 45

networks:
  default:
    # true when the tests themselves run in a container on this network (the
    # runner's default): the suite then has no route to anything but these two
    # services, so "talks only to local containers" is enforced, not promised.
    # Must be false for --host, where the tests reach the published ports.
    internal: ${AVALOKA_IT_NO_EGRESS:-false}
