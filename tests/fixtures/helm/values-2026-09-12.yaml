# deploy/helm/avaloka/values.yaml as of 0827b7a7 (2026-09-12), the chart the kind release
# avaloka (revision 5, 12 Sep) was installed from: its `helm get values --all` has exactly these
# keys. `helm upgrade --reuse-values` hands the NEW templates these values and none of the new
# chart's defaults. Every string under `secrets` and every *key/secret/password/token/url/uri
# value is blanked (14 values); the structure is what the test needs.
replicaCount: 1
