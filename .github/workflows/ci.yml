# The gate, run on every pull request.
#
# Deliberately the SAME script a contributor runs locally -- scripts/ci.sh --
# rather than a parallel list of steps that drifts from it. If CI passes and
# your machine does not, that is a difference worth finding, and it can only be
# found if both run the same thing.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range docs/INSTALL.md claims to support. Claiming it and not
        # testing it is how 3.12 quietly stops working.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System packages
        # Graphviz is a system package, not a pip one: the `graphviz` wheel is
        # only a binding to the `dot` binary. Without it the planner-graph
        # tests skip themselves, so CI would go green without ever rendering a
        # plan. Installing it here is what makes that suite actually run.
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install
        # The same installer a user runs, so a break in it fails CI rather than
        # being discovered by the first person to clone the repository.
        run: PYTHON=python ./scripts/install.sh --no-venv

      - name: Environment check
        run: python scripts/doctor.py

      - name: Test gate
        # --fast drops the multi-minute and Kaggle-dependent tests; the full
        # gate including the benchmark runs on the release workflow.
        run: PYTHON=python ./scripts/ci.sh --fast

  ui-unit:
    # The UI's unit and component tests. Like the Python gate, this runs the
    # command a contributor runs -- `npm run test:unit` -- not a parallel list
    # of steps. Hermetic: jsdom, no browser, no backend, no network after install.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The major ui/Dockerfile builds with.
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        # The lockfile install the image build uses, so a lockfile that has
        # drifted from package.json fails here rather than in the image.
        run: npm ci

      - name: Unit and component tests
        run: npm run test:unit

  ui-e2e:
    # One Playwright spec against an already-running deployment. It needs a UI,
    # a backend and a signed-in session, none of which a pull request has, so
    # it is started by hand only and never gates anything: continue-on-error
    # keeps a failure here from turning the workflow red. With the variables
    # unset the spec skips itself and prints why.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_API_URL: ${{ vars.E2E_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Signed-in session
        # Login is by emailed link, so the session is recorded once by hand
        # (ui/tests/README.md) and stored as a secret. Absent, the spec skips.
        env:
          E2E_STORAGE_STATE_JSON: ${{ secrets.E2E_STORAGE_STATE_JSON }}
        run: |
          if [ -n "$E2E_STORAGE_STATE_JSON" ]; then
            printf '%s' "$E2E_STORAGE_STATE_JSON" > "$RUNNER_TEMP/e2e-state.json"
            echo "E2E_STORAGE_STATE=$RUNNER_TEMP/e2e-state.json" >> "$GITHUB_ENV"
          fi

      - name: End-to-end
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore

  benchmark:
    # The benchmark is the slow stage, so it runs once rather than per version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: PYTHON=python ./scripts/install.sh --no-venv
      - name: Benchmark
        run: python -m avaloka.benchmark run --json scorecard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-scorecard
          path: scorecard.json
