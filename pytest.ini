[pytest]
# torch's DLL probe fails harmlessly while transformers is lazily imported;
# faulthandler dumps a full stack to stderr each time, burying real results
# under screens of "Windows fatal exception: access violation". The import
# retries and succeeds -- this is noise, not a crash. (The genuine crash of
# the same name came from ChromaDB and is prevented in tests/conftest.py.)
addopts = -p no:faulthandler
testpaths = tests
markers =
    cloud: requires real cloud credentials
    integration: exercises real agents/LLMs
    cluster: requires a live Kubernetes cluster
    kuberay: requires KubeRay CRDs in the cluster
    kaggle: validates the optional full downloaded Kaggle CSV files
    slow: multi-minute runtime
    langgraph_server: starts a real `langgraph dev`. Applied automatically to any test module that imports langgraph_cli (tests/conftest.py). The main test environment does not have the CLI (requirements.txt), so these run in the LangGraph server venv instead: scripts/langgraph_server_tests.sh
    defect: asserts intended behaviour against a confirmed defect; always paired with xfail(strict=True)
    single: prompt suites - short conversational prompts (Tier.SINGLE)
    multi: prompt suites - fully specified multi-clause prompts (Tier.MULTI)
    transfer: prompt suites - transfer prompts routed to the DTA (Tier.TRANSFER)
    operations: prompt suites - transformation families with a result-table check (Tier.OPERATION)
    containers: needs the Postgres and object-store containers started by scripts/integration.sh; always also `integration`, and never skips
    kaggle_efficiency: paired local CPU/runtime benchmark over downloaded Kaggle datasets
    notebook: executes a recipe's generated notebook in a kernel (needs avaloka[recipes-test])
    heavy: generates a multi-million-row file and runs a recipe on it; skipped unless AVALOKA_HEAVY_TESTS=1
