version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: staging-chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/staging_chroma:/chroma/chroma

  postgres:
    image: postgres:15
    container_name: staging-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-testdb}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/staging_postgres:/var/lib/postgresql/data
