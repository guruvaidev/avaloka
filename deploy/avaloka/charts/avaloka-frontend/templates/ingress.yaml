{{- /* Skip in blue-green mode; avaloka-router owns the active ingress. */ -}}
{{- if and .Values.ingress.enabled (not .Values.color) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "avaloka-frontend.fullname" . }}
  labels:
    {{- include "avaloka-frontend.labels" . | nindent 4 }}
  annotations:
    # upload.maxBodySize is the one place the edge body cap is set (D5).
    nginx.ingress.kubernetes.io/proxy-body-size: {{ required "upload.maxBodySize must be set (a finite nginx size, e.g. 1024m)" .Values.upload.maxBodySize | quote }}
    {{- with (omit (.Values.ingress.annotations | default dict) "nginx.ingress.kubernetes.io/proxy-body-size") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "avaloka-frontend.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
