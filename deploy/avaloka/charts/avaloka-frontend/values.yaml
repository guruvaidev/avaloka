replicaCount: 1

# Blue-green color. Leave empty for legacy single-release deploys.
color: ""

image:
  repository: avaloka-frontend
  tag: latest
  pullPolicy: IfNotPresent

# Backend API URL injected into the frontend container at runtime. The
# avaloka-router stable Service hostname is the right value for blue-green.
config:
  apiBaseUrl: ""
  langgraphBaseUrl: ""

service:
  port: 8080

serviceAccount:
  create: false

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

autoscaling:
  enabled: false

# Largest request body nginx passes to the app. The API enforces the real upload
# limit -- the hosted plan, or a self-hosted server's disk and memory -- and
# refuses an over-limit Content-Length before reading the body. This is the
# outer bound, including for requests the API cannot pre-check (no
# Content-Length). Keep it finite, and above the 300 MB a self-hosted install
# must accept (D5). Rendered as nginx.ingress.kubernetes.io/proxy-body-size;
# a copy left in ingress.annotations is ignored.
upload:
  maxBodySize: "1024m"
