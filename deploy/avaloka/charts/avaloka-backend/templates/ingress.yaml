{{- /*
Legacy single-release ingress. Skipped automatically in blue-green mode
(.Values.color set) because the avaloka-router chart owns the active ingress.
*/ -}}
{{- if and .Values.ingress.enabled (not .Values.color) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "avaloka-backend.fullname" . }}
  labels:
    {{- include "avaloka-backend.labels" . | nindent 4 }}
  annotations:
    # upload.maxBodySize is the one place the edge body cap is set (D5).
    nginx.ingress.kubernetes.io/proxy-body-size: {{ required "upload.maxBodySize must be set (a finite nginx size, e.g. 1024m)" .Values.upload.maxBodySize | quote }}
    {{- with (omit (.Values.ingress.annotations | default dict) "nginx.ingress.kubernetes.io/proxy-body-size") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  # The API only. The LangGraph container is internal: the api container in the
  # same pod is its only caller (LANGGRAPH_API_URL=http://localhost:3000), so it
  # has no host here and no route in any chart.
  rules:
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "avaloka-backend.fullname" . }}-api
                port:
                  number: {{ .Values.service.api.port }}
{{- end }}
