# Avaloka router — stable Services + Ingress that flip between blue/green.
#
# promote.sh sets --set activeColor=<new>; rollback.sh sets it back.
# The colored Deployments (avaloka-blue, avaloka-green) keep running through
# the flip; only the Service selector changes, so in-flight requests on the
# old color complete inside the soak window before its pods are torn down.

# Active color served to the public. Switch via:
#   helm upgrade avaloka-router deploy/avaloka-router --set activeColor=green
activeColor: blue

service:
  frontend:
    port: 8080
  api:
    port: 9000

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    # The router targets are k8s Services, no need for nginx use-regex.
  hosts:
    frontend: avaloka.local
    api: avaloka-api.local
    # No langgraph host: the LangGraph server is internal-only, and the router
    # renders no route to it whatever is set here.
  tls: []
    # - hosts: [avaloka.example.com]
    #   secretName: avaloka-tls

# Largest request body nginx passes to the app. The API enforces the real upload
# limit -- the hosted plan, or a self-hosted server's disk and memory -- and
# refuses an over-limit Content-Length before reading the body. This is the
# outer bound, including for requests the API cannot pre-check (no
# Content-Length). Keep it finite, and above the 300 MB a self-hosted install
# must accept (D5). Rendered as nginx.ingress.kubernetes.io/proxy-body-size;
# a copy left in ingress.annotations is ignored.
upload:
  maxBodySize: "1024m"
