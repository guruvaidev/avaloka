{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avaloka-router
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    avaloka.io/router: "true"
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.frontend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avaloka-frontend-active
                port:
                  number: {{ .Values.service.frontend.port }}
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avaloka-api-active
                port:
                  number: {{ .Values.service.api.port }}
    - host: {{ .Values.ingress.hosts.langgraph }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avaloka-langgraph-active
                port:
                  number: {{ .Values.service.langgraph.port }}
{{- end }}
