apiVersion: v1
kind: Service
metadata:
  name: avaloka-frontend-active
  labels:
    app.kubernetes.io/name: avaloka-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    avaloka.io/router: "true"
  annotations:
    avaloka.io/active-color: {{ .Values.activeColor | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: frontend
    avaloka.io/color: {{ .Values.activeColor | quote }}
  ports:
    - name: http
      port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.port }}
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: avaloka-api-active
  labels:
    app.kubernetes.io/name: avaloka-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    avaloka.io/port: api
    avaloka.io/router: "true"
  annotations:
    avaloka.io/active-color: {{ .Values.activeColor | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: backend
    avaloka.io/color: {{ .Values.activeColor | quote }}
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: {{ .Values.service.api.port }}
      protocol: TCP

---
