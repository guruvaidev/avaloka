# minikube overlay for the avaloka (Part B) chart.
#   helm upgrade --install avaloka deploy/helm/avaloka -f deploy/helm/avaloka/values/values-minikube.yaml
# Local image built into the minikube docker daemon — never pull.
image:
  repository: avaloka-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  nodePort: 30085

# In-cluster S3. Without it a local install has no shared data plane: the API
# would write to its own pod filesystem and Ray workers on other nodes could not
# read it back (neither kind nor Docker Desktop has a ReadWriteMany storage
# class). The chart points STORAGE_BACKEND=s3 at this Service automatically.
#
# No console NodePort: SeaweedFS has no MinIO-console equivalent. That is a real
# UX regression for "browse the bucket from the laptop" -- use
# `kubectl port-forward svc/avaloka-seaweedfs 8333:8333` plus `aws --endpoint-url`
# instead. (MinIO's community console was itself gutted in 2025, so the thing
# being lost was already a shell of what the port mapping was added for.)
seaweedfs:
  enabled: true
  service:
    type: NodePort
  # Laptop-sized; raise for real datasets.
  persistence:
    size: 10Gi
