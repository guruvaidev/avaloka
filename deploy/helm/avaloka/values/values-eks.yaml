# EKS overlay for the avaloka (Part B) chart.
#   helm upgrade --install avaloka deploy/helm/avaloka -f deploy/helm/avaloka/values/values-eks.yaml
#
# Fronts the release with an AWS Application Load Balancer through the Gateway API.
# Prerequisites, all out of band:
#   1. AWS Load Balancer Controller >= v2.14 installed with the Gateway API CRDs
#      and its ALB controller enabled.
#   2. A GatewayClass whose controllerName is the controller's ALB controller —
#      name it below in gateway.className.
#   3. An ACM certificate covering every host in gateway.hosts.
#   4. Route 53 (or equivalent) ALIAS records for those hosts -> the ALB DNS name,
#      readable from `kubectl get gateway avaloka-gateway -o wide` once programmed.
image:
  # Point at your ECR image, e.g. <acct>.dkr.ecr.<region>.amazonaws.com/avaloka-api
  repository: ACCOUNT.dkr.ecr.REGION.amazonaws.com/avaloka-api
  tag: latest
  pullPolicy: Always

# ClusterIP, not LoadBalancer: the ALB registers pod IPs as target-group targets,
# so a second per-Service public address would only bypass the ALB's TLS and WAF.
service:
  type: ClusterIP

webui:
  service:
    type: ClusterIP
  apiBase: ""
  # Managed Supabase project the browser authenticates against.
  supabaseUrl: ""
  supabaseAnonKey: ""

gateway:
  enabled: true
  provider: aws
  # Must match the GatewayClass you created for the controller's ALB controller.
  className: alb
  hosts:
    - test.avaloka.ai
    - app.avaloka.ai
  tls:
    enabled: true
    # Not `secret`: the AWS controller ignores listeners[].tls.certificateRefs and
    # reads ACM ARNs from the LoadBalancerConfiguration the chart renders below.
    mode: external
  redirectHttpToHttps: true
  aws:
    certificateArns:
      - arn:aws:acm:REGION:ACCOUNT:certificate/CERTIFICATE_ID
    scheme: internet-facing
  # The ALB's own idle timeout still applies and defaults to 60s; raise it on the
  # load balancer as well, or long agent requests are cut off before this fires.
  routeTimeout: "3600s"

# IRSA: bind the KSA to an IAM role.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/avaloka

# No in-cluster object store on a managed cloud: EKS uses a real S3 bucket.
# Both gates must be off -- seaweedfs defaults to enabled.
seaweedfs:
  enabled: false
minio:
  enabled: false

config:
  storageBackend: "s3"
  # REQUIRED, and not merely cosmetic. storageBackend: "s3" with no bucket of its
  # own is exactly the condition avaloka.objectStoreIsStorageBackend treats as
  # "the local-S3 case", so leaving this empty made the chart adopt the
  # in-cluster store and route datasets into it -- S3_ENDPOINT_URL rendered as
  # http://avaloka-minio:9000 and S3_BUCKET as "avaloka" on a cloud cluster.
  # Replace with the real bucket the IRSA role above can write.
  s3Bucket: "avaloka-user-filestore"

# Disabling the in-cluster object store removes the artifact root MLflow was
# silently inheriting from it, and mlflow.yaml fails the render rather than
# starting a tracking server with nowhere to put artifacts. Point it at the same
# real bucket; the IRSA role annotated on the KSA above is what authorises it, so
# no static AWS credentials are rendered for this path.
mlflow:
  artifactsDestination: "s3://avaloka-user-filestore/mlflow-artifacts"
  # NOT setting defaultArtifactRoot here, deliberately: it is a direct-client
  # override that bypasses the tracking server's artifact proxy, and whether you
  # want that is a separate decision from fixing the routing above. If you run
  # distributed Ray training on this cluster you probably do want it -- see
  # values-gke.yaml, which sets it to the same URI and says why.
