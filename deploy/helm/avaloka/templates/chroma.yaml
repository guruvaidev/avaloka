{{- if .Values.chroma.enabled }}
# In-cluster Chroma vector store (layer-2 usage context).
#
# A StatefulSet with a volumeClaimTemplate: the claim is now owned by the
# workload rather than standing beside it, so the volume follows the pod when it
# is rescheduled and is not left behind on a node that went away.
#
# replicas stays 1. Open-source Chroma is single-node; a second replica would
# serve a different, empty collection.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "avaloka.fullname" . }}-chroma
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  replicas: 1
  serviceName: {{ include "avaloka.fullname" . }}-chroma-hl
  selector:
    matchLabels:
      {{- include "avaloka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chroma
  template:
    metadata:
      labels:
        {{- include "avaloka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chroma
    spec:
      containers:
        - name: chroma
          image: {{ .Values.chroma.image | quote }}
          imagePullPolicy: {{ .Values.chroma.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.chroma.port }}
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- if .Values.chroma.persistence.enabled }}
          # Tier L2 of the memory plane. Without a volume Chroma's usage-context
          # collection is an emptyDir: every pod restart silently erased what the
          # system had learned, which is why the learning loop could never be
          # observed working across deployments.
          volumeMounts:
            - name: chroma-data
              mountPath: /data
          {{- end }}
          resources:
            {{- toYaml .Values.chroma.resources | nindent 12 }}
{{- if .Values.chroma.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes:
          - {{ include "avaloka.accessMode" (dict "ctx" . "component" .Values.chroma) }}
        resources:
          requests:
            storage: {{ .Values.chroma.persistence.size | quote }}
        {{- include "avaloka.storageClass" (dict "ctx" . "component" .Values.chroma) | nindent 8 }}
{{- end }}
---
# Headless companion for stable pod DNS; clients keep using the ClusterIP
# Service below, so CHROMA_HOST is unchanged.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avaloka.fullname" . }}-chroma-hl
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  clusterIP: None
  selector:
    {{- include "avaloka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
  ports:
    - name: http
      port: {{ .Values.chroma.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avaloka.fullname" . }}-chroma
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  type: ClusterIP
  selector:
    {{- include "avaloka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
  ports:
    - name: http
      port: {{ .Values.chroma.port }}
      targetPort: http
      protocol: TCP
{{- end }}
