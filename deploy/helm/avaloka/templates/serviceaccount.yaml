{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "avaloka.serviceAccountName" . }}
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.celery.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "avaloka.celeryServiceAccountName" . }}
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
  {{- with .Values.celery.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
