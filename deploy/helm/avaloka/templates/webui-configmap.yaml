{{- if .Values.webui.enabled }}
# Avaloka React/Vite web UI (nginx). Serves the SPA, proxies the avaloka API routes
# to the in-cluster API (same-origin), and reads Supabase config at runtime so one
# image works against local or cloud Supabase.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avaloka.fullname" . }}-webui-nginx-config
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
data:
  default.conf.template: |
    # Rendered by nginx:alpine's envsubst entrypoint: only env-defined ${VARS} are
    # substituted (AVALOKA_API_UPSTREAM), so nginx's own $uri/$host are left intact.
    server {
        listen 80;
        server_name _;
        client_max_body_size 100m;
        root /usr/share/nginx/html;
        index index.html;

        location = /env-config.js {
            add_header Cache-Control "no-store";
        }

        # Keep in sync with ui/deploy/nginx.conf.template — this ConfigMap is mounted
        # over the image's copy. An unproxied API path falls through to the SPA
        # catch-all and returns index.html, which callers fail to parse as JSON.
        location ~ ^/(health|version|threads|api|docs|openapi\.json|buckets|datasets|tasks)(/|$) {
            resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
            set $avaloka_backend "${AVALOKA_API_UPSTREAM}";
            proxy_pass $avaloka_backend$request_uri;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        {{- if .Values.supabase.enabled }}
        # Supabase reached through the UI's own origin. A remote browser (cloud
        # workspace, tunnel, port-forward) cannot use a second host reliably: the
        # cross-origin call either trips CORS or is gated by the workspace proxy,
        # which surfaces in the UI as "Failed to fetch". Same-origin avoids both.
        location ~ ^/(auth|rest|realtime|storage|functions)/v1(/|$) {
            resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
            set $supabase_kong "http://{{ include "avaloka.fullname" . }}-supabase-kong.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.supabase.kong.port }}";
            proxy_pass $supabase_kong$request_uri;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }
        {{- end }}

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
