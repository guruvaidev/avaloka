{{- if .Values.langgraph.enabled }}
# LangGraph runs-API server (`langgraph dev`) hosting the avaloka agent graph
# (langgraph.json -> app/api/langgraph_app.py:graph). The API's /threads endpoints
# proxy here. Runs from the same avaloka-api image with a different command.
#
# Internal only. The API is its only caller (app/api/server.py lg_request: the
# thread registry), so:
#   network   ClusterIP, no Ingress in any chart, and the NetworkPolicy below
#             admits only the api pods, on this port
#   auth      every call but GET /ok needs LANGGRAPH_SERVICE_TOKEN, compared in
#             constant time, or gets 401 (app/api/langgraph_service_auth.py,
#             wired in through langgraph.json http.app). The token is generated
#             into the release Secret and kept across upgrades; the API and this
#             pod read it by secretKeyRef.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avaloka.fullname" . }}-langgraph
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: langgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "avaloka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: langgraph
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "avaloka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: langgraph
    spec:
      serviceAccountName: {{ include "avaloka.serviceAccountName" . }}
      containers:
        - name: langgraph
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "{{ .Values.langgraph.port }}", "--no-browser"]
          ports:
            - name: http
              containerPort: {{ .Values.langgraph.port }}
          envFrom:
            - configMapRef:
                name: {{ include "avaloka.fullname" . }}-config
            - secretRef:
                name: {{ include "avaloka.secretName" . }}
          env:
            # The token this server requires (named, so a Secret without it is
            # a start error rather than a server that refuses every call).
            - name: LANGGRAPH_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "avaloka.secretName" . }}
                  key: LANGGRAPH_SERVICE_TOKEN
            # `langgraph dev` otherwise reports each start to LangChain's
            # analytics and asks PyPI for a newer version.
            - name: LANGGRAPH_CLI_NO_ANALYTICS
              value: "1"
            - name: LANGGRAPH_NO_VERSION_CHECK
              value: "true"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.langgraph.resources | nindent 12 }}
          {{- if or .Values.gcp.existingSecret .Values.modelCache.enabled }}
          volumeMounts:
            {{- if .Values.gcp.existingSecret }}
            - name: gcp-sa
              mountPath: {{ .Values.gcp.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.modelCache.enabled }}
            - name: model-cache
              mountPath: /root/.cache
            {{- end }}
          {{- end }}
      {{- if or .Values.gcp.existingSecret .Values.modelCache.enabled }}
      volumes:
        {{- if .Values.gcp.existingSecret }}
        - name: gcp-sa
          secret:
            secretName: {{ .Values.gcp.existingSecret | quote }}
        {{- end }}
        {{- if .Values.modelCache.enabled }}
        - name: model-cache
          emptyDir:
            sizeLimit: {{ .Values.modelCache.sizeLimit | quote }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avaloka.fullname" . }}-langgraph
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: langgraph
spec:
  type: ClusterIP
  selector:
    {{- include "avaloka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: langgraph
  ports:
    - name: http
      port: {{ .Values.langgraph.port }}
      targetPort: http
      protocol: TCP
---
# Ingress to the LangGraph server: the api pods, on its port; nothing else.
# Celery, celery-executor, the UI and the MCP server never call it (only
# lg_request in app/api/server.py does). Egress is left as it was.
# NetworkPolicy is enforced by the CNI (Calico, Cilium, GKE Dataplane V2 do;
# some do not). Without enforcement the service token still guards every call.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "avaloka.fullname" . }}-langgraph
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: langgraph
spec:
  podSelector:
    matchLabels:
      {{- include "avaloka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: langgraph
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "avaloka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - port: {{ .Values.langgraph.port }}
          protocol: TCP
{{- end }}
