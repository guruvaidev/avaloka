{{- if .Values.rbac.create }}
# The application identity submits Ray jobs and reads pod/service status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "avaloka.fullname" . }}
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters", "rayjobs", "rayservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "avaloka.fullname" . }}
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "avaloka.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "avaloka.fullname" . }}
  apiGroup: rbac.authorization.k8s.io


{{- if .Values.celery.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "avaloka.celeryServiceAccountName" . }}
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- if .Values.celery.rbac.rayJobs }}
  # Scheduled Ray jobs in KubeRay mode (app/infra/ray_job_runner.py): kubectl
  # apply of a code ConfigMap + RayJob, status polling, submitter logs, and
  # deleting the ConfigMap afterwards.
  - apiGroups: ["ray.io"]
    resources: ["rayjobs"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "avaloka.celeryServiceAccountName" . }}
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "avaloka.celeryServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "avaloka.celeryServiceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
