{{- if .Values.ui.enabled }}
# Opt-in Streamlit UI (D1 step 5). Off by default; the API is the primary workload.
# Shares the ConfigMap/Secret env with the API and talks to the API in-cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avaloka.fullname" . }}-ui
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "avaloka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "avaloka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ include "avaloka.serviceAccountName" . }}
      containers:
        - name: avaloka-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "avaloka.fullname" . }}-config
            - secretRef:
                name: {{ include "avaloka.secretName" . }}
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avaloka.fullname" . }}-ui
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "avaloka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
{{- end }}
