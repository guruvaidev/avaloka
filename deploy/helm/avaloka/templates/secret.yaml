{{- if not .Values.existingSecret }}
{{- /* One value for both Secrets below; include it once (each call without a
       given value or an existing Secret draws a new random). */}}
{{- $rayToken := "" }}
{{- if (include "avaloka.rayAuthEnabled" $) }}
{{- $rayToken = include "avaloka.generatedSecret" (dict "ctx" . "key" "RAY_AUTH_TOKEN" "value" .Values.secrets.rayAuthToken) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avaloka.fullname" . }}-secrets
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY_PLANNING_AGENT: {{ .Values.secrets.groqPlanningKey | quote }}
  GROQ_API_KEY_CODING_AGENT: {{ .Values.secrets.groqCodingKey | quote }}
  # Bare key used by the visualization agent; falls back to the coding-agent key.
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default .Values.secrets.groqCodingKey | quote }}
  # HMAC key used for deterministic PII pseudonymisation/tokenisation.
  # Training with supported sensitive columns is refused when this is empty.
  # Generated when not given, and kept across upgrades (avaloka.generatedSecret).
  AVALOKA_PII_KEY: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "AVALOKA_PII_KEY" "value" .Values.secrets.piiKey) | quote }}
  STRIPE_TEST_API_KEY: {{ .Values.secrets.stripeTestApiKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  PAYPAL_WEBHOOK_ID: {{ .Values.secrets.paypalWebhookId | quote }}
  {{- with .Values.secrets.openrouterKey }}
  # The default provider's key (inference.provider "openrouter", MP-01
  # 2026-11-01). With provider "groq" it arms the OpenRouter backup instead
  # (app/core/model_fallback.py). Emitted only when provided.
  OPENROUTER_API_KEY: {{ . | quote }}
  {{- end }}
  # The API validates HS256 JWTs against SUPABASE_JWT_SECRET (app/api/server.py:265).
  # When in-cluster Supabase is enabled, default to its JWT secret so the API accepts
  # tokens gotrue issues to the web UI (unless an explicit secret is provided).
  {{- if .Values.secrets.jwtSecret }}
  SUPABASE_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- else if and .Values.supabase.enabled (not .Values.config.supabaseUrl) }}
  SUPABASE_JWT_SECRET: {{ .Values.supabase.jwtSecret | quote }}
  {{- else }}
  SUPABASE_JWT_SECRET: ""
  {{- end }}
  # Service-role key: lets the API read cloud storage connection rows (bypassing RLS)
  # for /buckets/list. Ownership is still enforced in code against the caller's JWT
  # sub — see connection_belongs_to_user() in app/api/cloud_connections.py.
  {{- if .Values.secrets.supabaseServiceRoleKey }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | quote }}
  {{- else if and .Values.supabase.enabled (not .Values.config.supabaseUrl) }}
  # Use the bundled key only with the bundled Supabase URL. Never pair a
  # caller-supplied external project URL with this local service-role key.
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.supabase.serviceKey | quote }}
  {{- else }}
  SUPABASE_SERVICE_ROLE_KEY: ""
  {{- end }}
  # The AES-GCM key every sealed credential uses (cloud_datasets ciphertext from
  # the encrypt-cloud-credentials edge function, which reads it from this Secret;
  # MCP/GitHub tokens; customer database credentials at rest and in transit;
  # chat-typed passwords; credential handles). See app/core/encryption_key.py.
  # Never empty: secrets.dbEncryptionKey (or supabase.functions.dbEncryptionKey)
  # if set and not a published value, else the value this release's Secret
  # already holds (an upgrade never rotates it -- rotating orphans every
  # ciphertext), else a new random one. A published value is replaced; NOTES.txt warns.
  DB_ENCRYPTION_KEY: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "DB_ENCRYPTION_KEY" "value" (.Values.secrets.dbEncryptionKey | default .Values.supabase.functions.dbEncryptionKey)) | quote }}
  {{- with (.Values.lineage).databaseUrl }}
  # Lineage store, when it is not the database POSTGRES_URL names. Here rather
  # than in the ConfigMap because the URL carries a password.
  AVALOKA_LINEAGE_DB_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.mlflow.enabled }}
  # Only the MLflow server uses this direct database URI. API and Ray clients use
  # MLFLOW_TRACKING_URI, which points at the internal HTTP Service.
  MLFLOW_BACKEND_STORE_URI: {{ include "avaloka.mlflowBackendStoreUri" . | quote }}
  {{- if (include "avaloka.mlflowAuthEnabled" $) }}
  # MLflow basic-auth (mlflow.auth). The server creates this admin user from
  # these two keys; every MLflow client (API, LangGraph, Celery through envFrom;
  # Ray pods through secretKeyRef) sends them, because the mlflow client reads
  # MLFLOW_TRACKING_USERNAME/_PASSWORD from its environment. The password is
  # generated when not given and kept across upgrades (avaloka.generatedSecret).
  MLFLOW_TRACKING_USERNAME: {{ (dig "auth" "adminUsername" "avaloka" $.Values.mlflow) | quote }}
  MLFLOW_TRACKING_PASSWORD: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "MLFLOW_TRACKING_PASSWORD" "value" .Values.secrets.mlflowAdminPassword) | quote }}
  # Static Flask key the basic-auth app requires for CSRF (the same in every
  # worker and replica). Server-side only; generated and kept the same way.
  MLFLOW_FLASK_SERVER_SECRET_KEY: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "MLFLOW_FLASK_SERVER_SECRET_KEY" "value" "") | quote }}
  {{- with (dig "auth" "databaseUri" "" $.Values.mlflow) }}
  # MLflow's user store, when it is not the pod's own SQLite. May carry a password.
  MLFLOW_AUTH_DATABASE_URI: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if (include "avaloka.rayAuthEnabled" $) }}
  # Ray token authentication (ray.auth): the app's Ray clients send it (Ray reads
  # RAY_AUTH_TOKEN from the environment; RAY_AUTH_MODE comes from the ConfigMap),
  # and KubeRay-mode RayJobs get it in their own <rayjob>-env Secret. The Ray
  # pods read the same value from the Secret below. Kept across upgrades.
  RAY_AUTH_TOKEN: {{ $rayToken | quote }}
  {{- end }}
  {{- if include "avaloka.objectStoreIsStorageBackend" . }}
  # The in-cluster store's credentials are the S3 credentials for the whole stack.
  # boto3, s3fs and pyarrow all pick these up from the environment, so nothing in
  # the app has to know which S3-compatible store is behind the endpoint.
  AWS_ACCESS_KEY_ID: {{ include "avaloka.objectStoreAccessKey" . | quote }}
  AWS_SECRET_ACCESS_KEY: {{ include "avaloka.objectStoreSecretKey" . | quote }}
  {{- else }}
  {{- with .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
  # Shared secret the API presents to the onboarding routes as the service
  # identity (X-Avaloka-Service-Token); the MCP pod reads it from this same
  # Secret. Never empty: secrets.mcpServiceToken if set (and not a published
  # value), else the value this release's Secret already holds (so an upgrade
  # does not rotate it), else a new random one (avaloka.generatedSecret).
  # /admin routes never accept it: they take only the signed service MAC.
  MCP_SERVICE_TOKEN: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "MCP_SERVICE_TOKEN" "value" .Values.secrets.mcpServiceToken) | quote }}
  # Shared secret between the API and the LangGraph server (templates/langgraph.yaml),
  # which answers 401 to every call without it (app/api/langgraph_service_auth.py).
  # Its own token, not MCP_SERVICE_TOKEN: it opens nothing else. Both read it by
  # secretKeyRef. Never empty, never printed: secrets.langgraphServiceToken if set
  # (and not a published value), else the value this release's Secret already
  # holds (an upgrade does not rotate it), else a new random one (avaloka.generatedSecret).
  LANGGRAPH_SERVICE_TOKEN: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "LANGGRAPH_SERVICE_TOKEN" "value" .Values.secrets.langgraphServiceToken) | quote }}
  # Shared secret between the graph's pods (api, langgraph, celery) and the
  # /execute service (templates/execute-service.yaml), which answers 401 without
  # it. Its own token, not MCP_SERVICE_TOKEN: the service runs untrusted code
  # that can read the token, and this one opens nothing else. Never empty, not
  # rotated on upgrade, and a published value is replaced (avaloka.generatedSecret).
  EXECUTE_SERVICE_TOKEN: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "EXECUTE_SERVICE_TOKEN" "value" .Values.secrets.executeServiceToken) | quote }}
{{- if (include "avaloka.rayAuthEnabled" $) }}
---
# The Ray auth token for the Ray pods and the KubeRay operator, in its own
# Secret: KubeRay's authOptions.secretName needs the key auth_token, and the Ray
# pods (which run model-written code) get this one key by secretKeyRef rather
# than the release Secret. Same value as RAY_AUTH_TOKEN above. In the Ray
# namespace, where the RayCluster and RayService are applied.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avaloka.rayAuthSecretName" . }}
  namespace: {{ include "avaloka.rayNamespace" . }}
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: ray-auth
type: Opaque
stringData:
  auth_token: {{ $rayToken | quote }}
{{- end }}
{{- end }}
