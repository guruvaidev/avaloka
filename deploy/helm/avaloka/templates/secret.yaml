{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avaloka.fullname" . }}-secrets
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY_PLANNING_AGENT: {{ .Values.secrets.groqPlanningKey | quote }}
  GROQ_API_KEY_CODING_AGENT: {{ .Values.secrets.groqCodingKey | quote }}
  # Bare key used by the visualization agent; falls back to the coding-agent key.
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default .Values.secrets.groqCodingKey | quote }}
  # HMAC key used for deterministic PII pseudonymisation/tokenisation.
  # Generated when not given, and kept across upgrades (avaloka.generatedSecret).
  AVALOKA_PII_KEY: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "AVALOKA_PII_KEY" "value" .Values.secrets.piiKey) | quote }}
  STRIPE_TEST_API_KEY: {{ .Values.secrets.stripeTestApiKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  PAYPAL_WEBHOOK_ID: {{ .Values.secrets.paypalWebhookId | quote }}
  # Shared secret between the API (planner) and the MCP server. The onboarding
  # routes release a database password only to a caller presenting it, and
  # /admin/customers refuses everything else. Both workloads read it here.
  # Generated when not given, and kept across upgrades (avaloka.generatedSecret).
  MCP_SERVICE_TOKEN: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "MCP_SERVICE_TOKEN" "value" .Values.secrets.mcpServiceToken) | quote }}
  {{- with .Values.secrets.openrouterKey }}
  # Optional backup provider. Groq enforces its token-per-minute limit per
  # ORGANISATION, so both GROQ_* keys above share one budget and a busy planner
  # gets 429. With this set the Planner retries those on OpenRouter
  # (app/core/model_fallback.py). Emitted only when provided — an empty value
  # would arm nothing and only add a confusing key to the Secret.
  OPENROUTER_API_KEY: {{ . | quote }}
  {{- end }}
  # The API validates HS256 JWTs against SUPABASE_JWT_SECRET (app/api/server.py:265).
  # When in-cluster Supabase is enabled, default to its JWT secret so the API accepts
  # tokens gotrue issues to the web UI (unless an explicit secret is provided).
  {{- if .Values.secrets.jwtSecret }}
  SUPABASE_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- else if and .Values.supabase.enabled (not .Values.config.supabaseUrl) }}
  SUPABASE_JWT_SECRET: {{ .Values.supabase.jwtSecret | quote }}
  {{- else }}
  SUPABASE_JWT_SECRET: ""
  {{- end }}
  # Service-role key: lets the API read cloud storage connection rows (bypassing RLS)
  # for /buckets/list. Ownership is still enforced in code against the caller's JWT
  # sub — see connection_belongs_to_user() in app/api/cloud_connections.py.
  {{- if .Values.secrets.supabaseServiceRoleKey }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | quote }}
  {{- else if and .Values.supabase.enabled (not .Values.config.supabaseUrl) }}
  # Use the bundled key only with the bundled Supabase URL. Never pair a
  # caller-supplied external project URL with this local service-role key.
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.supabase.serviceKey | quote }}
  {{- else }}
  SUPABASE_SERVICE_ROLE_KEY: ""
  {{- end }}
  # The AES-GCM key every sealed credential uses: cloud_datasets ciphertext from
  # the encrypt-cloud-credentials edge function (which reads it from this
  # Secret), MCP/GitHub tokens, customer database connection strings at rest
  # and in transit, chat-typed passwords. See app/core/encryption_key.py.
  # Never empty: secrets.dbEncryptionKey (or supabase.functions.dbEncryptionKey)
  # if set and not a published value, else the value this release's Secret
  # already holds (so an upgrade does not rotate it -- rotating orphans every
  # ciphertext), else a new random one. A published value is replaced, and
  # NOTES.txt says so.
  DB_ENCRYPTION_KEY: {{ include "avaloka.generatedSecret" (dict "ctx" . "key" "DB_ENCRYPTION_KEY" "value" (.Values.secrets.dbEncryptionKey | default .Values.supabase.functions.dbEncryptionKey)) | quote }}
  {{- with .Values.lineage.databaseUrl }}
  # Lineage store, when it is not the database POSTGRES_URL names. Here rather
  # than in the ConfigMap because the URL carries a password.
  AVALOKA_LINEAGE_DB_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.mlflow.enabled }}
  # Only the MLflow server uses this direct database URI. API and Ray clients use
  # MLFLOW_TRACKING_URI, which points at the internal HTTP Service.
  MLFLOW_BACKEND_STORE_URI: {{ include "avaloka.mlflowBackendStoreUri" . | quote }}
  {{- end }}
  {{- if include "avaloka.objectStoreIsStorageBackend" . }}
  # The in-cluster store's credentials are the S3 credentials for the whole stack.
  # boto3, s3fs and pyarrow all pick these up from the environment, so nothing in
  # the app has to know which S3-compatible store is behind the endpoint.
  AWS_ACCESS_KEY_ID: {{ include "avaloka.objectStoreAccessKey" . | quote }}
  AWS_SECRET_ACCESS_KEY: {{ include "avaloka.objectStoreSecretKey" . | quote }}
  {{- else }}
  {{- with .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
