{{- if .Values.webui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avaloka.fullname" . }}-webui
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "avaloka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      annotations:
        # nginx renders default.conf.template at container start, so a ConfigMap
        # edit alone leaves the running pod on the old config.
        checksum/config: {{ include (print $.Template.BasePath "/webui-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "avaloka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webui
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "avaloka.fullname" . }}-webui-nginx-config
      containers:
        - name: webui
          image: "{{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag }}"
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          env:
            # nginx reverse-proxies the API routes (see webui-configmap.yaml) to this API.
            # Default to the fully-qualified Service DNS: nginx's resolver does NOT
            # apply /etc/resolv.conf search domains, so a short name wouldn't resolve.
            - name: AVALOKA_API_UPSTREAM
              value: {{ .Values.webui.apiUpstream | default (printf "http://%s.%s.svc.cluster.local:9000" (include "avaloka.fullname" .) .Release.Namespace) | quote }}
            # Must resolve INSIDE this pod: every browser call is routed through
            # the SSR server's /api/public/backend-proxy. Do not set "" expecting
            # same-origin -- it is falsy in backend-config.ts and falls back to
            # 127.0.0.1:8010, which nothing listens on here.
            - name: API_BASE
              value: {{ .Values.webui.apiBase | default (printf "http://%s.%s.svc.cluster.local:9000" (include "avaloka.fullname" .) .Release.Namespace) | quote }}
            # Browser-reachable Supabase (in-cluster NodePort when supabase.enabled,
            # else the explicit URL). The supabase-js client talks to it directly.
            - name: SUPABASE_URL
              value: {{ include "avaloka.webuiSupabaseUrl" . | quote }}
            - name: SUPABASE_ANON_KEY
              value: {{ include "avaloka.webuiSupabaseAnonKey" . | quote }}
            # Read by the SSR Supabase admin client (SUPABASE_ADMIN_KEY_ENV in
            # config.ts); without it the app shows a "Missing ... secret" banner.
            - name: PRIMARY_SUPABASE_SERVICE_ROLE_KEY
              value: {{ .Values.supabase.serviceKey | quote }}
            - name: MCP_API_BASE
              value: {{ include "avaloka.webuiMcpApiBase" . | quote }}
            - name: MCP_TOOL_BASE
              value: {{ include "avaloka.webuiMcpToolBase" . | quote }}
            # Payment provider credentials (SSR webhook/billing handlers).
            # Supplied at deploy time via --set-string secrets.*; empty by default.
            - name: STRIPE_TEST_API_KEY
              value: {{ .Values.secrets.stripeTestApiKey | quote }}
            - name: STRIPE_SECRET_KEY
              value: {{ .Values.secrets.stripeSecretKey | quote }}
            - name: STRIPE_WEBHOOK_SECRET
              value: {{ .Values.secrets.stripeWebhookSecret | quote }}
            - name: PAYPAL_WEBHOOK_ID
              value: {{ .Values.secrets.paypalWebhookId | quote }}
          ports:
            # - name: http
            #   containerPort: 80
            - name: http
              containerPort: {{ .Values.webui.containerPort | default 3000 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avaloka.fullname" . }}-webui
  labels:
    {{- include "avaloka.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
  {{- with .Values.webui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.webui.service.type }}
  selector:
    {{- include "avaloka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webui
  ports:
    - name: http
      port: {{ .Values.webui.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.webui.service.type "NodePort") .Values.webui.service.nodePort }}
      nodePort: {{ .Values.webui.service.nodePort }}
      {{- end }}
{{- end }}
