# deploy/helm/ray/raycluster.yaml
# KubeRay RayCluster for avaloka distributed compute (sampling / transforms / training).
# Applied by app/infra/ray_manager.apply_ray_cluster(). Head service DNS:
#   avaloka-raycluster-head-svc  (Ray client port 10001, dashboard 8265)
# ClusterIP only. The dashboard listens on 0.0.0.0 because the app and the KubeRay
# operator reach it through that Service; what keeps everyone else out is Ray's
# token authentication (RAY_AUTH_MODE=token below) and the chart's NetworkPolicy
# (deploy/helm/avaloka/templates/ray-networkpolicy.yaml). There used to be a
# node-port Service (30265) for the dashboard; it is gone (the kind-only opt-in is ray_dashboard_nodeport.yaml). From a workstation:
#   kubectl port-forward svc/avaloka-raycluster-head-svc 8265:8265
# and give the dashboard (or `ray job submit` with RAY_AUTH_MODE=token) the token:
#   kubectl get secret avaloka-ray-auth -o jsonpath='{.data.auth_token}' | base64 -d
# Needs the avaloka chart installed first (it creates avaloka-ray-auth) and the
# KubeRay operator 1.6+ (authOptions).
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: avaloka-raycluster
  labels:
    app.kubernetes.io/part-of: avaloka
spec:
  rayVersion: "2.56.0"
  enableInTreeAutoscaling: true
  # Keep the autoscaler sidecar small so head+sidecar fit on modest nodes.
  # Ray token authentication, enforced by Ray itself through the env below on
  # every container. authOptions tells the KubeRay operator (1.6+) to use the
  # same Secret when it reads job and Serve status from the dashboard; without
  # it the operator would be refused like anyone else.
  authOptions:
    mode: token
    secretName: avaloka-ray-auth
  autoscalerOptions:
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits: { cpu: "300m", memory: "512Mi" }
    # The autoscaler sidecar talks to GCS, so it needs the token too.
    env:
      # Ray token authentication. Ray >= 2.52 refuses every dashboard, Jobs API,
      # client and GCS call without this token. One key by secretKeyRef from the
      # Secret the avaloka chart generates (ray.auth); not optional, so a pod
      # without it does not start rather than start open.
      - name: RAY_AUTH_MODE
        value: token
      - name: RAY_AUTH_TOKEN
        valueFrom:
          secretKeyRef: { name: avaloka-ray-auth, key: auth_token }
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: avaloka
      spec:
        # The Helm chart creates this KSA. On GKE its Workload Identity
        # annotation grants Ray direct access to GCS without JSON keys.
        serviceAccountName: avaloka
        containers:
          - name: ray-head
            image: avaloka-ray:latest
            imagePullPolicy: IfNotPresent
            # Same storage wiring as the workers — the head runs job supervisors
            # and Ray Data reads that touch the same s3:// URIs.
            envFrom:
              - configMapRef:
                  name: avaloka-config
                  optional: true
            # These pods run user code, so they get named keys from avaloka-secrets,
            # never the whole Secret (database, JWT, Stripe, model-provider keys).
            # The object-store keys, plus the PII key MTA training reads in its
            # driver, which Ray runs on the head. A job's own connection keys
            # reach it per job (app/infra/ray_job_runner.py), not through the pod.
            env:
              # Third-party usage beacons off (app/core/thirdparty_optout.py), so a Ray
              # image built elsewhere is covered too; RAY_USAGE_STATS_ENABLED is Ray's own.
              - name: DO_NOT_TRACK
                value: "true"
              - name: SCARF_NO_ANALYTICS
                value: "true"
              - name: ORT_DISABLE_TELEMETRY
                value: "1"
              - name: ANONYMIZED_TELEMETRY
                value: "False"
              - name: MLFLOW_DISABLE_TELEMETRY
                value: "true"
              - name: HF_HUB_DISABLE_TELEMETRY
                value: "1"
              - name: DVC_NO_ANALYTICS
                value: "1"
              - name: RAY_USAGE_STATS_ENABLED
                value: "0"
              - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
                value: "false"
              - name: LANGGRAPH_CLI_NO_ANALYTICS
                value: "1"
              - name: LANGGRAPH_NO_VERSION_CHECK
                value: "true"
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef: { name: avaloka-secrets, key: AWS_ACCESS_KEY_ID, optional: true }
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef: { name: avaloka-secrets, key: AWS_SECRET_ACCESS_KEY, optional: true }
              - name: AVALOKA_PII_KEY
                valueFrom:
                  secretKeyRef: { name: avaloka-secrets, key: AVALOKA_PII_KEY, optional: true }
              # Ray token authentication. Ray >= 2.52 refuses every dashboard, Jobs API,
              # client and GCS call without this token. One key by secretKeyRef from the
              # Secret the avaloka chart generates (ray.auth); not optional, so a pod
              # without it does not start rather than start open.
              - name: RAY_AUTH_MODE
                value: token
              - name: RAY_AUTH_TOKEN
                valueFrom:
                  secretKeyRef: { name: avaloka-ray-auth, key: auth_token }
              # MLflow basic-auth (mlflow.auth): training runs log to, and Serve loads
              # models from, the tracking server. The mlflow client reads these itself.
              - name: MLFLOW_TRACKING_USERNAME
                valueFrom:
                  secretKeyRef: { name: avaloka-secrets, key: MLFLOW_TRACKING_USERNAME, optional: true }
              - name: MLFLOW_TRACKING_PASSWORD
                valueFrom:
                  secretKeyRef: { name: avaloka-secrets, key: MLFLOW_TRACKING_PASSWORD, optional: true }
            volumeMounts:
              - name: gcp-sa
                mountPath: /var/secrets/gcp
                readOnly: true
            ports:
              - { containerPort: 6379, name: gcs }
              - { containerPort: 8265, name: dashboard }
              - { containerPort: 10001, name: client }
              - { containerPort: 8000, name: serve }
            # Ray's own head processes (GCS, dashboard, raylet) idle near 2Gi, so a
            # 2Gi limit left nothing for the JobSupervisor actor: every submitted
            # job died instantly with "Task was killed due to the node running low
            # on memory ... 1.99GB / 2.00GB". Keep headroom above the idle baseline.
            resources:
              requests: { cpu: "300m", memory: "2Gi" }
              limits: { cpu: "2", memory: "6Gi" }
        volumes:
          # Optional for MinIO/S3 and GKE Workload Identity. Local kind needs
          # this conventional Secret to read private gs:// training datasets.
          - name: gcp-sa
            secret:
              secretName: avaloka-gcp-sa
              optional: true
  workerGroupSpecs:
    - groupName: cpu-workers
      replicas: 1
      minReplicas: 0     # idle workers scale to zero (K8-11)
      maxReplicas: 4
      rayStartParams: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: avaloka
        spec:
          serviceAccountName: avaloka
          containers:
            - name: ray-worker
              image: avaloka-ray:latest
              imagePullPolicy: IfNotPresent
              # Ray workers load the datasets the API wrote, so they need the same
              # storage wiring — STORAGE_BACKEND, S3_BUCKET and, for an in-cluster
              # MinIO, S3_ENDPOINT_URL/AWS_ENDPOINT_URL plus credentials. Without
              # the endpoint a worker resolves s3:// against real AWS and fails
              # with NoSuchBucket. optional: true keeps Ray usable on its own when
              # the avaloka chart is not installed in this namespace.
              envFrom:
                - configMapRef:
                    name: avaloka-config
                    optional: true
              # Named keys only, as on the head: the object-store keys. The PII
              # key reaches the workers as a task argument from the driver.
              env:
                # Third-party usage beacons off (app/core/thirdparty_optout.py), so a Ray
                # image built elsewhere is covered too; RAY_USAGE_STATS_ENABLED is Ray's own.
                - name: DO_NOT_TRACK
                  value: "true"
                - name: SCARF_NO_ANALYTICS
                  value: "true"
                - name: ORT_DISABLE_TELEMETRY
                  value: "1"
                - name: ANONYMIZED_TELEMETRY
                  value: "False"
                - name: MLFLOW_DISABLE_TELEMETRY
                  value: "true"
                - name: HF_HUB_DISABLE_TELEMETRY
                  value: "1"
                - name: DVC_NO_ANALYTICS
                  value: "1"
                - name: RAY_USAGE_STATS_ENABLED
                  value: "0"
                - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
                  value: "false"
                - name: LANGGRAPH_CLI_NO_ANALYTICS
                  value: "1"
                - name: LANGGRAPH_NO_VERSION_CHECK
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: avaloka-secrets, key: AWS_ACCESS_KEY_ID, optional: true }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: avaloka-secrets, key: AWS_SECRET_ACCESS_KEY, optional: true }
                # Ray token authentication. Ray >= 2.52 refuses every dashboard, Jobs API,
                # client and GCS call without this token. One key by secretKeyRef from the
                # Secret the avaloka chart generates (ray.auth); not optional, so a pod
                # without it does not start rather than start open.
                - name: RAY_AUTH_MODE
                  value: token
                - name: RAY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef: { name: avaloka-ray-auth, key: auth_token }
                # MLflow basic-auth (mlflow.auth): training runs log to, and Serve loads
                # models from, the tracking server. The mlflow client reads these itself.
                - name: MLFLOW_TRACKING_USERNAME
                  valueFrom:
                    secretKeyRef: { name: avaloka-secrets, key: MLFLOW_TRACKING_USERNAME, optional: true }
                - name: MLFLOW_TRACKING_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: avaloka-secrets, key: MLFLOW_TRACKING_PASSWORD, optional: true }
              volumeMounts:
                - name: gcp-sa
                  mountPath: /var/secrets/gcp
                  readOnly: true
              # Transfer tasks pip-install daft/connectorx into the runtime env and
              # then hold a DataFrame in memory — 3Gi is tight for both at once.
              # MTA's default Ray plan reserves three CPUs per Torch worker (four
              # configured CPUs minus one for input processing), so each pod must
              # advertise at least that much capacity or the placement group will
              # remain pending forever.
              resources:
                requests: { cpu: "300m", memory: "2Gi" }
                limits: { cpu: "4", memory: "6Gi" }
          volumes:
            - name: gcp-sa
              secret:
                secretName: avaloka-gcp-sa
                optional: true
