apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: __RAYJOB_NAME__
spec:
  entrypoint: python /home/ray/scripts/sample_code.py
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600

  # No credential is ever rendered into this CR or its ConfigMap: database URLs
  # and bucket keys reach the pods from the per-job Secret __RAYJOB_NAME__-env
  # (secretKeyRef below), which app/infra/ray_job_runner.py creates owned by
  # this RayJob right after it is applied, and deletes when the job ends.
  runtimeEnvYAML: |
    # Pinned to the versions requirements.txt resolves to, so a DTA job runs the
    # libraries the app generated and validated its script against; unpinned,
    # every job installed whatever PyPI had that day. Ray is never listed: the
    # image provides it. tests/test_ray_version_alignment.py holds these pins.
    pip:
      - pandas==2.3.3
      - daft==0.7.26
      - sqlalchemy==2.1.6
      - psycopg2-binary==2.9.13
      - PyMySQL==1.2.3
      - google-cloud-storage==3.17.1
      - sqlglot==30.27.0
      - connectorx==0.4.6
    env_vars:
      JOB_ID: "__JOB_ID__"
      PYTHONPATH: "/home/ray"

  rayClusterSpec:
    rayVersion: "2.56.0"
    # ray-auth:begin  Ray enforces the token through RAY_AUTH_MODE/RAY_AUTH_TOKEN on
    # every container; authOptions lets the KubeRay operator (1.6+) read this
    # job's status with the same token, from the job's own Secret. Needs Ray
    # >= 2.52 in the image. The runner removes every ray-auth block when the
    # app runs without RAY_AUTH_MODE=token (chart ray.auth.enabled=false).
    authOptions:
      mode: token
      secretName: __RAYJOB_NAME__-env
    # ray-auth:end
    enableInTreeAutoscaling: false

    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
      template:
        metadata:
          labels:
            app: __RAYJOB_NAME__
            ray-node-type: head
        spec:
          containers:
            - name: ray-head
              image: avaloka-dta-ray-cluster:latest
              imagePullPolicy: Always
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "1"
                limits:
                  memory: "8Gi"
                  cpu: "2"
              env:
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/secrets/google/key.json
                # ray-auth:begin  Ray token authentication (RAY_AUTH_MODE=token). The token
                # is this job's copy in its own Secret (key auth_token), put there by
                # app/infra/ray_job_runner.py from the app's RAY_AUTH_TOKEN.
                - name: RAY_AUTH_MODE
                  value: token
                - name: RAY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: __RAYJOB_NAME__-env
                      key: auth_token
                # ray-auth:end
                __SECRET_ENV_REFS__
              volumeMounts:
                - name: script-volume
                  mountPath: /home/ray/scripts
                - name: gcs-sa-key-volume
                  mountPath: /var/secrets/google
                  readOnly: true
          volumes:
            - name: script-volume
              configMap:
                name: __RAYJOB_NAME__-code
                items:
                  - key: sample_code.py
                    path: sample_code.py
            - name: gcs-sa-key-volume
              secret:
                secretName: __GCS_SECRET_NAME__
                # Optional: the job namespace (rbac.rayJobSecretsNamespace) need
                # not hold a platform GCS key.
                optional: true

    workerGroupSpecs:
      - groupName: small-group
        replicas: 1
        minReplicas: 1
        maxReplicas: 5
        rayStartParams: {}
        template:
          metadata:
            labels:
              app: __RAYJOB_NAME__
              ray-node-type: worker
          spec:
            containers:
              - name: ray-worker
                image: avaloka-dta-ray-cluster:latest
                imagePullPolicy: Always
                resources:
                  requests:
                    memory: "4Gi"
                    cpu: "1"
                  limits:
                    memory: "8Gi"
                    cpu: "2"
                env:
                  - name: GOOGLE_APPLICATION_CREDENTIALS
                    value: /var/secrets/google/key.json
                  # ray-auth:begin  Ray token authentication (RAY_AUTH_MODE=token). The token
                  # is this job's copy in its own Secret (key auth_token), put there by
                  # app/infra/ray_job_runner.py from the app's RAY_AUTH_TOKEN.
                  - name: RAY_AUTH_MODE
                    value: token
                  - name: RAY_AUTH_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: __RAYJOB_NAME__-env
                        key: auth_token
                  # ray-auth:end
                  __SECRET_ENV_REFS__
                volumeMounts:
                  - name: script-volume
                    mountPath: /home/ray/scripts
                  - name: gcs-sa-key-volume
                    mountPath: /var/secrets/google
                    readOnly: true
            volumes:
              - name: script-volume
                configMap:
                  name: __RAYJOB_NAME__-code
              - name: gcs-sa-key-volume
                secret:
                  secretName: __GCS_SECRET_NAME__
                  optional: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: __RAYJOB_NAME__-code
data:
  sample_code.py: |
    __INJECTION_SCRIPT__