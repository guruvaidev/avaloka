# Every top-level file and directory the public tree carries, on purpose.
# The exclusions above say what is withheld; this says what is published, so a
# new top-level path cannot slip through by being neither. The generator does
# not read it: tests/contract/test_c8_public_tree_generator.py computes the
# top-level entries of the tracked tree that survive the exclusions and holds
# them to this list exactly. A new directory that is neither listed here nor
# excluded above fails that test, and so does a listed entry that no longer
# exists. benchmarks/ and tests/benchmark/ are published on purpose;
# benchmarks.md (the benchmark strategy) is withheld above.
top_level:
  - .dockerignore
  - .env.example
  - .gcloudignore
  - .gitattributes
  - .github
  - .gitignore
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - LICENSE
  - NOTICE
  - README.md
  - README_CLI.md
  - SECURITY.md
  - VERSION
  - app
  - avaloka
  # the architecture diagram's source, cited by docs/architecture.md and
  # docs/research/README.md; the rendered PNG ships under docs/images
  - avaloka-architecture-2026-08.mermaid
  - benchmarks
  - deploy
  # the web quickstart (scripts/quickstart.sh): the documented laptop trial path
  - docker-compose.quickstart.yml
  - docker-compose.yml
  - docs
  - file_handler
  - langgraph.json
  - oss
  - pyproject.toml
  - pytest.ini
  - requirements-cloud-llm.txt
  - requirements-langgraph-server.txt
  - requirements.txt
  - scripts
  - telemetry_service
  - tests
  - ui

# Files that exist only on the public tree, applied after the exclusions.
overlay:
  - DCO
  - GOVERNANCE.md
  - MAINTAINERS.md
  # The commercial boundary. develop-1.6 can provision managed GKE/EKS/AKS
  # clusters; the public build gates that on cloud_provisioning, which
  # app.core.editions already marks COMMERCIAL but nothing was checking.
  # Overlaid rather than ported back, because develop-1.6 is where the
  # enterprise capability lives.
  - app/infra/providers/factory.py
  # The internal README documents a LaTeX build against sources the public
  # tree does not carry. This one explains why they are absent instead.
  - docs/research/README.md

# Sections replaced rather than added wholesale. The public quickstart does
# not assume SUPABASE_JWT_SECRET or a running redis-server; develop's does.
# Copying develop's README over the public one silently reverts that.
splice:
  - file: README.md
    section: "## Quickstart"
    from: oss/overlay/README.quickstart.md


# Invariants checked after every generation. A failure blocks the push.
assert_present:
  README.md:
    - "support@avaloka.ai"
    # Merged on the public repository (GitHub #82); kept so a later sync
    # cannot quietly revert an outside contribution.
    - "img.shields.io/github/stars/guruvaidev/avaloka"
    - "at your own risk"
    - "Not tested on"
  app/infra/providers/factory.py:
    - "CLOUD_PLATFORMS"
    - "cloud_provisioning"
  # The ignore rules are the only thing still guarding the withheld paths once
  # the files themselves are gone. The generated tree lost them once, because
  # the public .gitignore carried lines develop-1.6 did not.
  .gitignore:
    - "/artifacts/"
    - "/scorecard.json"
    - "ui/.lovable/"
  # pyarrow==16.1.0 ships cp38-cp312 wheels only. An uncapped floor sends a
  # 3.13+ interpreter into an Arrow C++ source build.
  pyproject.toml:
    - ">=3.11,<3.13"
assert_absent:
  README.md:
    - "SUPABASE_JWT_SECRET"
    - "redis-server"
  # These were hardened on the integration branch, not on develop-1.6. The
  # script's default SRC_BRANCH is develop-1.6, so generating from an
  # un-merged develop would quietly republish a developer's home directory and
  # a hardcoded version. Assert the hardened state rather than trusting the
  # operator to pass the right SRC_BRANCH.
  tests/kaggle_yellow_taxi_trip_data.py:
    - "C:/Users/"
  avaloka/version.py:
    - "__version__ = \"0.3.0\""

# Deliberately NOT carried into the overlay, recorded so the omission does not
