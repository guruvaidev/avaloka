[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avaloka"
version = "1.0.0"
description = "CLI-first agentic data-science execution platform that turns datasets and business objectives into validated reports, reproducible models and deployable inference services within explicit time and cost budgets."
readme = "README_CLI.md"
requires-python = ">=3.10"
# PEP 639 licence expression. Do NOT also add the legacy
# "License :: OSI Approved :: ..." classifier -- setuptools rejects the pair:
#   InvalidConfigError: License classifiers have been superseded by license
#   expressions. The expression below is the modern, machine-readable form.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Avaloka" }]
keywords = ["automl", "data-science", "agents", "cli", "mlops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
    "PyYAML>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
avaloka = "avaloka.cli:main"

[tool.setuptools.packages.find]
include = ["avaloka*"]

[tool.setuptools.package-data]
avaloka = ["reports/templates/*.html.j2", "examples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests/avaloka"]
addopts = "-q -m 'not kaggle'"
markers = [
    "kaggle: end-to-end benchmark over downloaded Kaggle datasets (needs the Kaggle CLI + data; opt in with -m kaggle)",
    "slow: long-running benchmark/e2e tests",
]
