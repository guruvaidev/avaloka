# Avaloka web stack on one laptop: the quickstart.
#
#   scripts/quickstart.sh up          # generate secrets, build, check models, start
#   scripts/quickstart.sh up --offline  # the same, with no internet egress
#   scripts/quickstart.sh down
#
# Do not run this file directly the first time: it needs the secrets
# scripts/quickstart.sh generates into .env.quickstart (gitignored), and every
# `${VAR:?...}` below stops compose with a pointer to the script if one is
# missing.
#
# What runs (all from two images built from this checkout):
#   ui         TanStack SSR UI            127.0.0.1:${AVALOKA_UI_PORT:-3000}
#   api        FastAPI, app.api.server    127.0.0.1:${AVALOKA_API_PORT:-9000}
#   langgraph  `langgraph dev`, the agent graph the API drives
#   mcp        MCP server + database onboarding (app.mcp_server.multi_tenant_mcp_server)
#   redis      sessions and the Celery/RedBeat broker
#   postgres   a sample database to try the database connector on
#   executor   runs model-written code (app/executor), isolated: see below
#
# Only the UI and the API are published, and only on 127.0.0.1. Redis,
# Postgres, LangGraph and the MCP server have no host port at all, so they
# cannot collide with a Redis or Postgres you already run. Move the two
# published ports with AVALOKA_UI_PORT / AVALOKA_API_PORT (the script picks
# free ones if the defaults are taken).
#
# Sign-in is AVALOKA_AUTH_MODE=local (app/core/local_auth.py): one local
# account, no Supabase. The API refuses that mode unless the deployment says
# self_hosted, which this file does and the Helm chart never does.
#
# Models: inference goes to Ollama on the host (host.docker.internal:11434)
# by default; INFERENCE_PROVIDER and friends in .env.quickstart change that.
# Embedding models are baked into the API image and HF_HUB_OFFLINE is on.
#
# Generated code (the coder's analysis script, the validator's sample check,
# a transfer's sample preview) runs in `executor`, never in the API process.
# `executor` is on the `sandbox` network only, which is `internal` and shared
# with nothing but `api`: it has no route to postgres, redis, mcp, langgraph or
# the internet, and those names do not even resolve there. It can open a
# connection to api:9000, whose routes need a signed-in user like the browser's. It runs as nobody
# on a read-only root with every capability dropped, has no /state volume and
# none of the backend environment (no DB_ENCRYPTION_KEY, provider keys, auth
# secret or REDIS_URL). The API sends each run's script and its input files
# over that network and gets the output file back (app/executor/protocol.py).
#
# Offline (AVALOKA_QS_OFFLINE=true, set by `up --offline`): the backend
# network becomes `internal`, so api, langgraph, mcp, redis and postgres have
# no route off it at all. The UI keeps a second network so the browser can
# reach it, and the `ollama-relay` service forwards one port, to the host's
# Ollama and nowhere else. The API's own host port is not published on an
# internal network; reach it through the UI as the browser does.

name: avaloka-quickstart

x-backend-env: &backend-env
  AVALOKA_EDITION: oss
  AVALOKA_DEPLOYMENT: self_hosted
  AVALOKA_AUTH_MODE: local
  AVALOKA_LOCAL_AUTH_SECRET: ${AVALOKA_LOCAL_AUTH_SECRET:?run scripts/quickstart.sh up, which generates .env.quickstart}
  AVALOKA_LOCAL_AUTH_EMAIL: ${AVALOKA_LOCAL_AUTH_EMAIL:-local@avaloka.local}
  AVALOKA_LOCAL_AUTH_PASSWORD: ${AVALOKA_LOCAL_AUTH_PASSWORD:?run scripts/quickstart.sh up}
  # One key for the API and the MCP server: it seals stored database
  # credentials, and the onboarding user assertion and MCP admin signature are
  # derived from it, so both processes must hold the same value.
  DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?run scripts/quickstart.sh up}
  # The API's service identity on the onboarding /customers routes (the
  # planner and the API present it; the MCP server checks it), so api,
  # langgraph and mcp must hold the same value. It is the only identity that
  # reaches a database registered before owners were recorded, so without it
  # a transfer from such a legacy database is refused. Never the executor's.
  MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:?run scripts/quickstart.sh up}
  # HMAC key for PII pseudonymisation, generated by scripts/quickstart.sh.
  AVALOKA_PII_KEY: ${AVALOKA_PII_KEY:?run scripts/quickstart.sh up}
  REDIS_URL: redis://redis:6379/0
  # Celery/RedBeat read their own variable, defaulting to the Helm Service
  # name avaloka-redis, which does not resolve here.
  CELERY_REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: local
  LOCAL_STORAGE_ROOT: /state/filestore
  DATA_DIR: /state/data
  CHAT_OUTPUT_DIR: /state/tmp
  PLANNER_GRAPH_OUTPUT_DIR: /state/planner_graphs
  LANGGRAPH_API_URL: http://langgraph:2024
  MCP_SERVER_URL: http://mcp:8010
  ONBOARDING_API_URL: http://mcp:8010
  LANGSMITH_TRACING: "false"
  INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-local}
  INFERENCE_LOCAL_BASE_URL: ${INFERENCE_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
  INFERENCE_LOCAL_MODEL: ${INFERENCE_LOCAL_MODEL:-gemma4:e4b}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AVALOKA_DISABLE_MODEL_FALLBACK: "1"
  AVALOKA_LOCAL_EXEC_TIMEOUT: "300"
  # Where generated code runs (the `executor` service below).
  AVALOKA_EXECUTOR_URL: http://executor:8020
  # Offline model loading (the image sets these too; repeated so an image
  # built elsewhere behaves the same), and third-party usage beacons off.
  # Memory embeddings run on the bundled local model; nothing is sent out.
  # Opting in to OpenAI needs EMBEDDING_PROVIDER=openai AND
  # EMBEDDING_OPENAI_API_KEY, and sends memory text (including table and
  # column names) to OpenAI. OPENAI_API_KEY alone never selects it.
  EMBEDDING_PROVIDER: local
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  DO_NOT_TRACK: "true"
  SCARF_NO_ANALYTICS: "true"
  ORT_DISABLE_TELEMETRY: "1"
  ANONYMIZED_TELEMETRY: "False"
  MLFLOW_DISABLE_TELEMETRY: "true"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DVC_NO_ANALYTICS: "1"
  RAY_USAGE_STATS_ENABLED: "0"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  LANGGRAPH_CLI_NO_ANALYTICS: "1"
  LANGGRAPH_NO_VERSION_CHECK: "true"
  # botocore's instance-metadata credential probe (169.254.169.254), off.
  AWS_EC2_METADATA_DISABLED: "true"
  PYTHONUNBUFFERED: "1"
  # A known, intermittent SIGSEGV in the API's HTTP client path (exit 139) is
  # still open; with this the next one leaves a Python stack in `logs`.
  PYTHONFAULTHANDLER: "1"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # app/api/server.py configures its own logging from this one.
  AVALOKA_LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-api-image: &api-image ${AVALOKA_API_IMAGE:-avaloka-api:quickstart}

services:
  redis:
    restart: unless-stopped
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: avaloka
      POSTGRES_PASSWORD: ${QS_POSTGRES_PASSWORD:?run scripts/quickstart.sh up}
      POSTGRES_DB: sample
    volumes:
      - qs-pgdata:/var/lib/postgresql/data
      - ./deploy/compose/quickstart/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avaloka -d sample"]
      interval: 5s
      timeout: 3s
      retries: 30

  mcp:
    restart: unless-stopped
    image: *api-image
    # --loop asyncio as the API image's CMD (#548): no uvloop under threaded clients.
    command: ["uvicorn", "app.mcp_server.multi_tenant_mcp_server:app", "--host", "0.0.0.0", "--port", "8010", "--loop", "asyncio"]
    environment:
      <<: *backend-env
      # The onboarding routes call this process's own admin routes.
      MCP_SERVER_URL: http://127.0.0.1:8010
      CUSTOMERS_FILE: /reg/customers.json
      AVALOKA_EMBED_WARMUP: "0"
    volumes:
      - qs-mcp:/reg
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  langgraph:
    restart: unless-stopped
    image: *api-image
    command: ["langgraph", "dev", "--config", "/app/langgraph.json", "--host", "0.0.0.0", "--port", "2024",
              "--no-browser", "--no-reload", "--allow-blocking"]
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - qs-state:/state
    # Not on `sandbox`: `langgraph dev` answers its runs API without auth, so
    # an executor that could reach it could drive the graph, which holds every
    # secret. The API runs the graph in-process (app/api/graph_runtime.py) and
    # is the only caller of the executor here.
    networks: [backend]
    depends_on:
      redis: { condition: service_healthy }
      mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2024/ok"]
      interval: 5s
      timeout: 5s
      retries: 120

  # Runs model-written code. Everything here is the isolation; app/executor/
  # server.py only has to not undo it. Deliberately NOT `<<: *backend-env`.
  executor:
    restart: unless-stopped
    image: *api-image
    command: ["python", "-m", "app.executor.server", "--host", "0.0.0.0", "--port", "8020"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 512
    # The only writable places: where a run's inputs are recreated at their
    # own paths (the API's TMP_ROOT under /var/tmp, its tempfiles under /tmp,
    # /state/filestore for a stored dataset) and the run's working directory.
    # All tmpfs, wiped after every run. /state here is empty, not the volume.
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /var/tmp:size=8g,mode=1777
      - /state:size=4g,mode=1777
    environment:
      AVALOKA_EXECUTOR_SANDBOX: "1"
      AVALOKA_EXECUTOR_STAGE_ROOTS: /tmp:/var/tmp:/state
      AVALOKA_EXECUTOR_MAX_TIMEOUT: "900"
      HOME: /tmp
      MPLCONFIGDIR: /tmp/.mpl
      PYTHONUNBUFFERED: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      ORT_DISABLE_TELEMETRY: "1"
      ANONYMIZED_TELEMETRY: "False"
      MLFLOW_DISABLE_TELEMETRY: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DVC_NO_ANALYTICS: "1"
      RAY_USAGE_STATS_ENABLED: "0"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      LANGGRAPH_CLI_NO_ANALYTICS: "1"
      LANGGRAPH_NO_VERSION_CHECK: "true"
      AWS_EC2_METADATA_DISABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60

  api:
    restart: unless-stopped
    image: *api-image
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:${AVALOKA_API_PORT:-9000}:9000"
    volumes:
      - qs-state:/state
    networks: [backend, sandbox]
    depends_on:
      executor: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      mcp: { condition: service_healthy }
      langgraph: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 120

  ui:
    restart: unless-stopped
    image: ${AVALOKA_UI_IMAGE:-avaloka-ui:quickstart}
    build:
      context: ui
      dockerfile: Dockerfile
    environment:
      # Server side: the UI proxies every API call itself, so the browser
      # only ever talks to the UI's origin.
      API_BASE: http://api:9000
      # The database query service (MCP server). The connections pill asks its
      # GET /health through the proxy, which forwards only to configured bases.
      MCP_TOOL_BASE: http://mcp:8010
      AUTH_MODE: local
    ports:
      - "127.0.0.1:${AVALOKA_UI_PORT:-3000}:3000"
    networks: [backend, edge]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Offline mode only: the single hole in the internal network, to the host's
  # Ollama. It forwards one TCP port to one fixed address and nothing else.
  ollama-relay:
    profiles: ["offline"]
    image: *api-image
    command: ["python", "/relay.py", "0.0.0.0:11434", "host.docker.internal:11434"]
    volumes:
      - ./deploy/compose/quickstart/relay.py:/relay.py:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks:
      # Ollama answers 403 to a Host header it does not recognise (its
      # DNS-rebinding guard); it accepts names ending in .internal.
      backend: { aliases: ["ollama.internal"] }
      edge: {}

networks:
  backend:
    internal: ${AVALOKA_QS_OFFLINE:-false}
  edge: {}
  # api <-> executor only. Always internal, online or offline.
  sandbox:
    internal: true

volumes:
  qs-state: {}
  qs-mcp: {}
  qs-pgdata: {}
